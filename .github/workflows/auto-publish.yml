name: Auto-Publish All Gumroad Drafts

on:
  # Run 30 minutes after the main product creation workflow (which runs at 08:00 UTC)
  schedule:
    - cron: '30 8 * * *'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install playwright
      - run: playwright install chromium
      - name: Publish all drafts
        env:
          GUMROAD_EMAIL: ${{ secrets.GUMROAD_EMAIL }}
          GUMROAD_PASSWORD: ${{ secrets.GUMROAD_PASSWORD }}
        run: python publish_all.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: publish-screenshot
          path: publish_after.png
