name: Auto-Publish All Gumroad Drafts

on:
  schedule:
    - cron: '45 8 * * *'          # runs daily at 08:45 UTC
  workflow_dispatch:              # allows manual trigger

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install playwright
      - run: playwright install chromium
      - name: Publish all drafts
        env:
          GUMROAD_COOKIES: ${{ secrets.GUMROAD_COOKIES }}
        run: python publish_all.py           # <-- CORRECT file name
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: publish-screenshot
          path: publish_after.png
