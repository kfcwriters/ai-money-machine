name: Auto-Publish All Gumroad Drafts

on:
  schedule:
    - cron: '45 8 * * *'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install playwright requests          # ← added requests
      - run: playwright install chromium
      - name: Publish all drafts
        env:
          GUMROAD_COOKIES: ${{ secrets.GUMROAD_COOKIES }}
          GUMROAD_TOKEN: ${{ secrets.GUMROAD_TOKEN }}   # optional, but helps
        run: python publish_all.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debug-screenshots
          path: |
            after_checkboxes.png
            publish_after.png
            products_page.png
