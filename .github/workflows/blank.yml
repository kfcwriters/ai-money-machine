name: AI Money Machine Daily Run (Ko‑fi)

on:
  schedule:
    - cron: '0 8 * * *'          # Runs every day at 08:00 UTC
  workflow_dispatch:              # Allows manual trigger

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install libraries
        run: pip install requests fpdf2

      - name: Run the AI Money Machine
        env:
          KOFI_API_KEY: ${{ secrets.KOFI_API_KEY }}
        run: python main.py
