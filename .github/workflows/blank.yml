name: AI Money Machine Daily Run

on:
  schedule:
    - cron: '0 8 * * *'   # Runs every day at 8:00 UTC
  workflow_dispatch:      # Lets you manually trigger a run with a button

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install libraries
        run: pip install requests fpdf2

      - name: Run the AI Money Machine
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GUMROAD_TOKEN: ${{ secrets.GUMROAD_TOKEN }}
        run: python main.py
