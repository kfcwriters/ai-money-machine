name: Daily Amazon Affiliate Post

on:
  schedule:
    # Runs every day at 09:00 UTC = 2:30 PM IST
    - cron: "0 9 * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the GitHub Actions tab too

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run poster script
        env:
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          BUFFER_CHANNEL_IDS: ${{ secrets.BUFFER_CHANNEL_IDS }}
        run: python scripts/post_product.py

      - name: Commit updated products.csv
        run: |
          git config user.name "auto-poster-bot"
          git config user.email "actions@github.com"
          git add products.csv
          git diff --quiet --cached || git commit -m "Mark product as posted [skip ci]"
          git push
