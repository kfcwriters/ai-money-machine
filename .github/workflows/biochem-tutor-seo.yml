name: Daily Biochemistry SEO Article

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install libraries
        run: pip install requests
      - name: Publish article
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
          HIRE_ME_URL_BIOCHEM: ${{ secrets.HIRE_ME_URL_BIOCHEM }}
        run: python biochem_tutor_seo.py
