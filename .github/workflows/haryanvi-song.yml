name: Daily Haryanvi Romantic Song

on:
  schedule:
    - cron: '0 6 * * *'   # Daily at 06:00 UTC (11:30 AM IST)
  workflow_dispatch:

jobs:
  create-video:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick

      - name: Install Python libraries
        run: |
          pip install requests edge-tts moviepy opencv-python-headless numpy pillow

      - name: Generate song video
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: python haryanvi_song.py

      - name: Upload video as artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: haryanvi-song-video
          path: haryanvi_song.mp4
          retention-days: 7
