name: Daily Journal Article

on:
  schedule:
    # Runs every day at 10:00 UTC (adjust as needed)
    - cron: '0 10 * * *'
  workflow_dispatch:  # Allows manual trigger from GitHub UI

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Needed to commit the new article

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run article generator
        run: python scripts/journal_digest.py
        # No environment variables needed – GITHUB_TOKEN is automatic
