name: Weekly Checklist Pack

on:
  schedule:
    - cron: '0 15 * * 5'   # Every Friday 15:00 UTC
  workflow_dispatch:

jobs:
  create-checklist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install libraries
        run: pip install requests fpdf2
      - name: Generate and publish checklist
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GUMROAD_TOKEN: ${{ secrets.GUMROAD_TOKEN }}
        run: python checklist_pack.py
