name: Daily Amazon Affiliate Reel

on:
  schedule:
    # Runs every day at 11:00 UTC = 4:30 PM IST (offset from the image-post
    # workflow so the two don't compete for the same time slot)
    - cron: "0 11 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  post-reel:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Confirm ffmpeg is available
        run: ffmpeg -version

      - name: Configure git for auto-commit
        run: |
          git config user.name "auto-poster-bot"
          git config user.email "actions@github.com"

      - name: Run reel poster script
        env:
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          BUFFER_CHANNEL_IDS: ${{ secrets.BUFFER_CHANNEL_IDS }}
        run: python scripts/post_reel.py

      - name: Commit updated reels.csv
        run: |
          git add reels.csv
          git diff --quiet --cached || git commit -m "Mark reel product as posted [skip ci]"
          git push
