name: Dev.to Syndication - BioChemTutor

on:
  schedule:
    - cron: '0 19 * * *'   # Daily 19:00 UTC
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install libraries
        run: pip install requests feedparser
      - name: Publish to Dev.to
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
          HASKNODE_PUBLICATION_ID: ${{ secrets.HASKNODE_PUBLICATION_ID_BIOCHEM }}
          HIRE_ME_URL: ${{ secrets.HIRE_ME_URL_BIOCHEM }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python devto_biochem.py
